<!doctype html>
<html lang="th" data-mode="light" data-brand="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F6F3">
  <title>Back Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=4">
  <script>
    // ใช้ธีมที่จำไว้ก่อนหน้าเว็บวาด (กันจอกะพริบ)
    try {
      var t = JSON.parse(localStorage.getItem('bo:theme') || '{}');
      var mode = t.mode === 'auto' || !t.mode
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t.mode;
      document.documentElement.dataset.mode = mode;
      document.documentElement.dataset.brand = t.brand ? 'on' : 'off';
    } catch (e) { /* ใช้ค่าเริ่มต้น */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=4"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/html5-qrcode.min.js" defer></script>
  <script src="vendor/qrcode.js"></script>
  <script src="promptpay.js?v=4"></script>
  <script src="app.js?v=4"></script>
  <script src="pos.js?v=4"></script>
  <script src="app-extra.js?v=4"></script>
</body>
</html>

<!doctype html>
<!--
  ════════════════════════════════════════════════════════════════
   2325 App — หน้าแอป (LINE LIFF)
  ════════════════════════════════════════════════════════════════
   หน้าในแอป (เปิดด้วย ?page=...)
     ?page=home      หน้าแรก
     ?page=menu      เมนู
     ?page=delivery  เดลิเวอรี่
     ?page=reward    บัตรสมาชิก / สะสมแต้ม   (ใช้ได้หลังเชื่อม LINE)
     ?page=staff     โหมดพนักงาน             (ใช้ได้หลังเชื่อม LINE)
     ?page=wellness  Wellness
     ?page=book      จอง Wellness / การจองของฉัน
     ?page=promos    โปรโมชั่นทั้งหมด

   ส่วนที่ต้องแก้มีที่เดียว: "ส่วนที่ 1: ตั้งค่า" ใน <script> ด้านล่าง
   ✏️ = แก้ได้      ⛔ = ไม่ต้องแก้
  ════════════════════════════════════════════════════════════════
-->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E7">
  <title>2325 CAFE</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ A: สีและตัวอักษร   ✏️ เปลี่ยนสีได้ตรงนี้
       ═══════════════════════════════════════ */
    :root {
      --bg: #F6F1E7;          /* พื้นหลังครีม */
      --card: #FCFAF5;        /* การ์ด */
      --ink: #2B2A28;         /* ตัวหนังสือหลัก / เทาดำ */
      --ink-2: #5B5750;       /* ตัวหนังสือรอง */
      --muted: #8A8178;       /* ตัวหนังสือจาง */
      --gold: #B8894A;        /* สีเน้น ทองกาแฟ */
      --gold-soft: #EFE3CF;   /* ทองอ่อน */
      --wood: #D9C3A0;        /* ไม้สีอ่อน */
      --line: #E8DFD0;        /* เส้นแบ่ง */
      --ok: #4E7A5A;
      --danger: #B4533F;
      --radius: 18px;
      --font: 'IBM Plex Sans Thai', system-ui, sans-serif;
      --font-en: 'Montserrat', 'IBM Plex Sans Thai', sans-serif;
      --tabbar-h: 64px;
    }


    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ B: พื้นฐาน   ⛔
       ═══════════════════════════════════════ */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: var(--font); font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);
    }
    body.no-tabbar { padding-bottom: 24px; }
    [hidden] { display: none !important; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }
    .en { font-family: var(--font-en); letter-spacing: .08em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .center { text-align: center; }

    .page-head { padding: 22px 0 14px; }
    .page-head .en { font-size: 12px; color: var(--gold); }
    .page-head h1 { font-size: 26px; font-weight: 600; line-height: 1.25; }

    .card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--line); padding: 18px; margin-bottom: 14px;
    }
    .card-title { font-size: 17px; font-weight: 600; margin-bottom: 12px; }

    .btn {
      font: inherit; font-weight: 500; border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px 16px; border-radius: 14px;
      background: var(--ink); color: var(--bg); transition: transform .08s, opacity .2s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.gold { background: var(--gold); color: #fff; }
    .btn.soft { background: var(--gold-soft); color: var(--ink); }
    .btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
    .btn.ghost { background: transparent; color: var(--muted); padding: 10px; font-size: 14px; }
    .btn svg { width: 20px; height: 20px; flex: none; }

    .spinner {
      width: 32px; height: 32px; margin: 40px auto; border-radius: 50%;
      border: 3px solid var(--gold-soft); border-top-color: var(--gold);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .skeleton {
      background: linear-gradient(90deg, #EDE5D8 25%, #F4EEE4 50%, #EDE5D8 75%);
      background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 12px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .notice {
      background: var(--gold-soft); border-radius: 14px; padding: 12px 14px;
      font-size: 14px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px;
    }
    .notice svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--gold); }


    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ C: แถบเมนูด้านล่าง   ⛔
       ═══════════════════════════════════════ */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: rgba(252, 250, 245, .96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar .inner { max-width: 480px; margin: 0 auto; display: flex; height: var(--tabbar-h); }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 11.5px; color: var(--muted); background: none; border: 0; font-family: var(--font);
      cursor: pointer;
    }
    .tab svg { width: 23px; height: 23px; }
    .tab.active { color: var(--ink); font-weight: 600; }
    .tab.active svg { color: var(--gold); }


    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ D: หน้าแรก   ⛔
       ═══════════════════════════════════════ */
    .hero {
      position: relative; margin: 14px 0 0; border-radius: 24px; overflow: hidden;
      min-height: 300px; display: flex; align-items: flex-end; color: #F6F1E7;
      background:
        radial-gradient(70% 60% at 80% 25%, rgba(190, 140, 80, .45), transparent 60%),
        linear-gradient(160deg, #4a3a2c 0%, #2b221b 55%, #1c1714 100%);
    }
    .hero img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.05) 25%, rgba(18,15,13,.8) 100%);
    }
    .hero .txt { position: relative; z-index: 1; padding: 22px; width: 100%; }
    .hero .logo { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; margin-bottom: 12px; background: #fff; }
    .hero .tag { font-size: 12px; color: var(--wood); }
    .hero h1 { font-size: 28px; line-height: 1.25; font-weight: 700; margin: 6px 0 4px; white-space: pre-line; }
    .hero .sub { font-size: 14px; opacity: .85; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 7px 14px;
      border-radius: 999px; background: rgba(246, 241, 231, .14); border: 1px solid rgba(246, 241, 231, .25); font-size: 13px;
    }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: #C98A6B; }
    .status.open i { background: #7DBB8A; box-shadow: 0 0 0 3px rgba(125, 187, 138, .25); }

    .mini {
      margin-top: 14px; border-radius: 20px; padding: 16px 18px; color: #F6F1E7;
      background: linear-gradient(150deg, #3A3733, #2B2A28 60%, #1F1E1C);
      display: flex; gap: 14px; align-items: center;
    }
    .mini .l { flex: 1; min-width: 0; }
    .mini .hi { font-size: 13px; opacity: .7; }
    .mini .pts { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
    .mini .pts b { font-family: var(--font-en); font-size: 26px; }
    .mini .pts span { font-size: 13px; opacity: .7; }
    .seg { display: flex; gap: 4px; margin: 10px 0 8px; }
    .seg i { flex: 1; height: 6px; border-radius: 4px; background: rgba(246, 241, 231, .15); }
    .seg i.on { background: var(--gold); }
    .mini .note { font-size: 12.5px; color: var(--wood); }
    .qrbtn {
      width: 70px; height: 64px; border-radius: 16px; background: var(--gold-soft); color: var(--ink); border: 0; flex: none; white-space: nowrap;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font: 600 10.5px var(--font); cursor: pointer;
    }
    .qrbtn svg { width: 24px; height: 24px; }
    .join {
      margin-top: 14px; border-radius: 20px; padding: 16px; background: var(--card); border: 1px solid var(--line);
      display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    }
    .join .ic { width: 50px; height: 50px; border-radius: 14px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; flex: none; }
    .join .ic svg { width: 26px; height: 26px; }
    .join b { display: block; font-size: 15.5px; }
    .join span { font-size: 13px; color: var(--muted); }
    .join .go { margin-left: auto; color: var(--gold); flex: none; }
    .join .go svg { width: 20px; height: 20px; }

    .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 10px; }
    .sec h2 { font-size: 18px; font-weight: 600; }
    .sec a { font-size: 13px; color: var(--gold); font-weight: 600; }
    .hs {
      display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px;
      scroll-snap-type: x mandatory; scroll-padding: 0 16px; scrollbar-width: none;
    }
    .hs::-webkit-scrollbar { display: none; }
    .hs > * { scroll-snap-align: start; }
    .promo {
      flex: none; width: min(82vw, 340px); aspect-ratio: 16 / 9; border-radius: 18px; position: relative; overflow: hidden;
      color: #fff; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; text-align: left;
      border: 0; font: inherit; cursor: pointer;
      background: radial-gradient(50% 60% at 75% 35%, #d9b48a, transparent 70%), linear-gradient(135deg, #8a6242, #3d2a1d);
    }
    .promo.alt { background: radial-gradient(50% 60% at 70% 35%, #b9cf9a, transparent 70%), linear-gradient(135deg, #6f8a55, #2f3d25); }
    .promo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .promo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0) 60%); }
    .promo > div { position: relative; z-index: 1; }
    .promo .badge2 {
      position: absolute; top: 14px; left: 14px; z-index: 1; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,.92); color: var(--ink); padding: 4px 10px; border-radius: 999px;
    }
    .promo b { display: block; font-size: 19px; line-height: 1.25; }
    .promo span.d { font-size: 12.5px; opacity: .9; }
    .promo.full { width: 100%; margin-bottom: 12px; }
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
    .dots i { width: 6px; height: 6px; border-radius: 4px; background: var(--line); transition: all .2s; }
    .dots i.on { width: 18px; background: var(--gold); }
    .hs .item { flex: none; width: 150px; }
    .hs .item .ph, .hs .item img { width: 150px; height: 150px; border-radius: 18px; object-fit: cover; }
    .hs .item .nm { font-weight: 600; font-size: 15px; margin-top: 8px; line-height: 1.3; }
    .hs .item .pr { color: var(--gold); font-weight: 600; font-size: 14px; }

    .well {
      margin-top: 26px; border-radius: 22px; overflow: hidden; position: relative; min-height: 160px; color: #fff; padding: 18px;
      display: block; width: 100%; text-align: left; border: 0; font: inherit; cursor: pointer;
      background: radial-gradient(60% 80% at 85% 50%, #9cc3d0, transparent 70%), linear-gradient(135deg, #3b5a66, #1c2a30);
    }
    .well img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .well::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,32,38,.88), rgba(20,32,38,.15)); }
    .well > div { position: relative; z-index: 1; }
    .well .k { font-size: 11px; color: #bfe0ea; }
    .well b { display: block; font-size: 22px; margin: 4px 0 2px; }
    .well p { font-size: 13px; opacity: .88; max-width: 75%; }
    .chip2 {
      display: inline-flex; gap: 6px; align-items: center; margin-top: 12px; font-size: 12.5px; font-weight: 600;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); padding: 6px 12px; border-radius: 999px;
    }
    .well .ics { position: absolute; right: 18px; top: 18px; display: flex; gap: 8px; z-index: 1; }
    .well .ics span { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.14); display: grid; place-items: center; }
    .well .ics svg { width: 22px; height: 22px; }
    .svc { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .svc:first-of-type { border-top: 0; padding-top: 0; }
    .svc .ic { width: 44px; height: 44px; border-radius: 12px; background: #E3EDF0; color: #3b5a66; display: grid; place-items: center; flex: none; }
    .svc .ic svg { width: 22px; height: 22px; }
    .svc b { display: block; font-weight: 600; }
    .svc span { font-size: 13.5px; color: var(--ink-2); }
    .home-info { margin-top: 26px; }

    .sheet-bg { position: fixed; inset: 0; background: rgba(20,19,18,.5); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
    .sheet {
      width: 100%; max-width: 480px; background: var(--card); border-radius: 24px 24px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
      text-align: center; animation: up .22s ease-out;
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet h3 { font-size: 18px; margin-bottom: 4px; }

    .info-row { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    .info-row:first-of-type { border-top: 0; padding-top: 2px; }
    .info-row svg { width: 20px; height: 20px; color: var(--gold); flex: none; margin-top: 2px; }
    .info-row .lbl { font-size: 13px; color: var(--muted); }
    .info-row .val { white-space: pre-line; }
    .info-row .act { margin-left: auto; align-self: center; flex: none; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
      padding: 7px 12px; border-radius: 999px; background: var(--gold-soft); color: var(--ink);
      border: 0; font-family: var(--font); cursor: pointer;
    }
    .social { display: flex; gap: 10px; margin-top: 4px; }


    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ E: เมนู   ⛔
       ═══════════════════════════════════════ */
    .chips {
      position: sticky; top: 0; z-index: 10; background: var(--bg);
      display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; margin: 0 -16px 8px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
      border: 1.5px solid var(--line); background: var(--card); color: var(--ink-2); cursor: pointer;
    }
    .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .reco { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px 18px; padding: 2px 16px 6px; scrollbar-width: none; }
    .reco::-webkit-scrollbar { display: none; }
    .reco .item { flex: none; width: 150px; }
    .reco .ph, .reco img { width: 150px; height: 150px; border-radius: 16px; object-fit: cover; }
    .reco .nm { font-weight: 500; margin-top: 8px; font-size: 15px; line-height: 1.3; }

    .cat-title { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 6px; scroll-margin-top: 64px; }
    .cat-title h2 { font-size: 19px; font-weight: 600; }
    .cat-title span { font-size: 13px; color: var(--muted); }

    .mitem { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .mitem:last-child { border-bottom: 0; }
    .mitem .ph, .mitem img { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; flex: none; }
    .mitem .body { flex: 1; min-width: 0; }
    .mitem .nm { font-weight: 500; line-height: 1.35; }
    .mitem .en-nm { font-size: 12px; color: var(--muted); font-family: var(--font-en); letter-spacing: .03em; }
    .mitem .desc { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
    .mitem .price { font-weight: 600; flex: none; text-align: right; white-space: nowrap; }
    .mitem.sold { opacity: .5; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      vertical-align: 2px; margin-left: 4px;
    }
    .badge.reco-b { background: var(--gold-soft); color: var(--gold); }
    .badge.sold-b { background: var(--ink); color: var(--bg); }
    .ph {
      display: grid; place-items: center;
      background: linear-gradient(135deg, #EADBC3 0%, var(--wood) 100%); color: rgba(43, 42, 40, .35);
    }
    .ph svg { width: 34%; height: 34%; }


    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ F: เดลิเวอรี่   ⛔
       ═══════════════════════════════════════ */
    .dcard {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px; margin-bottom: 12px; font: inherit; color: inherit; cursor: pointer;
    }
    .dcard .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; }
    .dcard .ic svg { width: 28px; height: 28px; }
    .dcard .t { font-weight: 600; font-size: 17px; }
    .dcard .s { font-size: 13.5px; color: var(--muted); }
    .dcard .arr { margin-left: auto; color: var(--muted); }
    .dcard .arr svg { width: 20px; height: 20px; }
    .dcard:disabled { opacity: .55; cursor: default; }


    /* ═══════════════════════════════════════
       สไตล์ ส่วนที่ G: บัตรสมาชิก   ⛔
       ═══════════════════════════════════════ */
    .mcard {
      position: relative; overflow: hidden; border-radius: 22px; padding: 20px; margin: 16px 0 14px;
      color: #F6F1E7;
      background:
        radial-gradient(90% 120% at 100% 0%, rgba(217, 195, 160, .30), transparent 55%),
        linear-gradient(150deg, #3A3733 0%, #2B2A28 60%, #1F1E1C 100%);
      box-shadow: 0 10px 28px rgba(43, 42, 40, .22);
    }
    .mcard .top { display: flex; justify-content: space-between; align-items: center; }
    .mcard .brand { font-family: var(--font-en); font-weight: 700; letter-spacing: .12em; font-size: 13px; opacity: .85; }
    .mcard .tier { font-size: 11px; letter-spacing: .1em; color: var(--wood); }
    .mcard .who { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #4A4640; border: 2px solid rgba(246, 241, 231, .4); flex: none; }
    .mcard .nm { font-size: 18px; font-weight: 600; line-height: 1.2; }
    .mcard .mid { font-size: 13px; opacity: .7; letter-spacing: .08em; }
    .mcard .pts { margin-top: 18px; display: flex; align-items: baseline; gap: 8px; }
    .mcard .pts b { font-family: var(--font-en); font-size: 46px; line-height: 1; }
    .mcard .pts span { opacity: .75; }
    .bar { height: 8px; border-radius: 999px; background: rgba(246, 241, 231, .16); overflow: hidden; margin-top: 12px; }
    .bar i { display: block; height: 100%; background: var(--wood); border-radius: 999px; transition: width .5s; }
    .mcard .next { font-size: 13px; opacity: .8; margin-top: 6px; }

    .reward { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .card-title + .reward { border-top: 0; padding-top: 0; }

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = Number(v); return isFinite(n) ? n : 0; };
const round4 = (n) => Math.round(n * 10000) / 10000;
const baht = (n) => num(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });

function priceText(p) {
  if (p === '' || p == null) return '';
  const s = String(p).trim();
  return /^\d+(\.\d+)?$/.test(s) ? '฿' + baht(s) : esc(s);
}

function errText(e) {
  return ERROR_TEXT[e && e.message] || 'เกิดข้อผิดพลาด (' + esc(e && e.message) + ')';
}

let toastTimer;
function toast(msg, type) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ''), 2800);
}

function store(op, key, val) {
  try {
    if (op === 'get') return JSON.parse(localStorage.getItem(key) || 'null');
    if (op === 'set') localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { /* เบราว์เซอร์ปิด storage — ใช้งานต่อได้ปกติ */ }
  return null;
}
function session(op, key, val) {
  try {
    if (op === 'get') return sessionStorage.getItem(key);
    if (op === 'set') sessionStorage.setItem(key, val);
    if (op === 'del') sessionStorage.removeItem(key);
  } catch (e) { /* ignore */ }
  return null;
}

/** โหมดตรวจสอบ: เปิดลิงก์แอปแล้วต่อท้าย ?debug=1 จะมีกล่องบันทึกการทำงานด้านบน */
const DEBUG = /debug=1/.test(decodeURIComponent(location.search));
function debug(msg) {
  console.log('[2325]', msg);
  if (!DEBUG) return;
  let box = document.getElementById('debug');
  if (!box) {
    box = document.createElement('pre');
    box.id = 'debug';
    box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;max-height:40vh;overflow:auto;' +
      'background:rgba(20,19,18,.92);color:#9fe3a8;font:12px/1.5 ui-monospace,monospace;padding:10px;border-radius:10px;white-space:pre-wrap;margin:0';
    document.body.appendChild(box);
  }
  box.textContent += new Date().toTimeString().slice(0, 8) + '  ' + msg + '\n';
}
window.addEventListener('error', (e) => debug('JS error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => debug('Promise error: ' + ((e.reason && e.reason.message) || e.reason)));

function placeholder() { return '<div class="ph">' + ICON.cup + '</div>'; }

/** ขอรูปจาก Google ในขนาดพอดีกรอบ (ไฟล์เล็ก โหลดเร็ว) */
function sizedImg(url, w) {
  if (!url) return '';
  const m = String(url).match(/drive\.google\.com\/thumbnail\?id=([\w-]+)/);
  if (m) url = 'https://lh3.googleusercontent.com/d/' + m[1] + '=w800';
  return /lh3\.googleusercontent\.com\/d\//.test(url) ? url.replace(/=w\d+$/, '') + '=w' + w : url;
}

/** รูปโหลดไม่ขึ้น → ลองลิงก์สำรองของ Drive 1 ครั้ง → ไม่ได้อีกแสดงกรอบว่าง */
function imgFail(img) {
  const m = img.src.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);
  if (m && !img.dataset.retry) {
    img.dataset.retry = '1';
    img.src = 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w600';
  } else {
    img.outerHTML = placeholder();
  }
}

function imgTag(url, alt, w) {
  if (!url) return placeholder();
  return '<img src="' + esc(sizedImg(url, w || 400)) + '" alt="' + esc(alt) + '" loading="lazy" decoding="async" onerror="imgFail(this)">';
}

function openLink(url) {
  if (!url) return;
  if (state.liffReady && liff.isInClient()) liff.openWindow({ url: url, external: true });
  else window.open(url, '_blank', 'noopener');
}

function spinner() { return '<div class="spinner"></div>'; }

function formatDate(v, withTime) {
  const d = new Date(v);
  if (!v || isNaN(d)) return '';
  const o = { day: 'numeric', month: 'short', year: '2-digit' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleString('th-TH', o);
}

const CACHE_KEY = 'app2325:public:' + CONFIG.API_URL.slice(-12);

async function loadPublic() {
  const cached = store('get', CACHE_KEY);
  if (cached && !state.data) {
    debug('ใช้ข้อมูลที่จำไว้ก่อน');
    setData(cached);
  }

  const t0 = Date.now();
  debug('เริ่มโหลดข้อมูลจากหลังบ้าน…');
  try {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 30000); // รอสูงสุด 30 วินาที
    let res;
    try {
      res = await fetch(CONFIG.API_URL + '?action=public', { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
    } finally {
      clearTimeout(timer);
    }
    debug('หลังบ้านตอบกลับ HTTP ' + res.status + ' ใน ' + (Date.now() - t0) + ' ms');
    const text = await res.text();
    let d;
    try { d = JSON.parse(text); } catch (e) {
      debug('ข้อมูลที่ได้ไม่ใช่ JSON: ' + text.slice(0, 120));
      throw new Error('NOT_JSON');
    }
    if (!d.ok) throw new Error(d.error || 'SERVER_ERROR');
    debug('ได้ข้อมูลแล้ว: เมนู ' + d.menu.length + ' หมวด');
    store('set', CACHE_KEY, d);
    setData(d);
  } catch (e) {
    const code = e.name === 'AbortError' ? 'TIMEOUT'
      : /fetch|load failed|network/i.test(e.message) ? 'NETWORK' : e.message;
    debug('โหลดไม่สำเร็จ: ' + code + ' (' + e.message + ')');
    if (!state.data) renderPublicError(new Error(code));
    // มีข้อมูลที่จำไว้แสดงอยู่แล้ว → ไม่ต้องแจ้งลูกค้า
  }
}

function setData(d) {
  const key = JSON.stringify(Object.assign({}, d, { updatedAt: 0 }));
  if (key === state.dataKey) return; // ไม่มีอะไรเปลี่ยน
  state.dataKey = key;
  state.data = d;
  dataResolve(d);
  document.title = d.shop.shopName || '2325 CAFE';
  safeRender('home', renderHome);
  safeRender('menu', renderMenu);
  safeRender('delivery', renderDelivery);
  safeRender('wellness', renderWellness);
  safeRender('promos', renderPromos);
  if (state.page === 'reward' && state.me) renderMember();
  if ($('#staff-shop')) $('#staff-shop').textContent = d.shop.shopName;
  if (state.page === 'staff' && state.staffMember) renderStaffMember();
}

/** ถ้าหน้าไหนแสดงผลพัง ให้ขึ้นข้อความแทนการค้าง */
function safeRender(page, fn) {
  try {
    fn();
  } catch (e) {
    console.error(e);
    debug('แสดงหน้า ' + page + ' ไม่สำเร็จ: ' + e.message);
    $('#view-' + page).innerHTML = '<div class="card center" style="margin-top:24px">' +
      '<p class="card-title">แสดงหน้านี้ไม่สำเร็จ</p>' +
      '<p class="muted small">' + esc(e.message) + '</p></div>';
  }
}

function renderPublicError(e) {
  const html = '<div class="card center" style="margin-top:24px">' +
    '<p style="font-size:34px">☕</p><p class="card-title">โหลดข้อมูลไม่สำเร็จ</p>' +
    '<p class="muted small" style="margin-bottom:14px">' + errText(e) + '</p>' +
    '<button class="btn" onclick="location.reload()">ลองใหม่</button></div>';
  ['home', 'menu', 'delivery', 'wellness', 'promos'].forEach((p) => ($('#view-' + p).innerHTML = html));
}

const PAGES = ['home', 'menu', 'delivery', 'reward', 'staff', 'wellness', 'promos', 'book'];

/** อ่านหน้าที่ต้องเปิดจาก ?page=... (รองรับตอน LINE ส่งมาเป็น liff.state) */
function initialPage() {
  const q = new URLSearchParams(location.search);
  let p = q.get('page');
  const st = q.get('liff.state');
  if (!p && st) {
    const s = st.indexOf('?') >= 0 ? st.slice(st.indexOf('?') + 1) : st;
    p = new URLSearchParams(s).get('page');
  }
  return PAGES.includes(p) ? p : 'home';
}

function go(page, fromUser) {
  if (!PAGES.includes(page)) page = 'home';
  state.page = page;
  document.querySelectorAll('.view').forEach((v) => (v.hidden = v.id !== 'view-' + page));
  const tabPage = page === 'book' ? 'wellness' : page;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.page === tabPage));
  const noTab = page === 'staff' || page === 'book';
  $('#tabbar').hidden = noTab;
  document.body.classList.toggle('no-tabbar', noTab);
  document.body.classList.remove('has-bbar');
  document.querySelectorAll('.sheet-bg').forEach((x) => x.remove());
  window.scrollTo(0, 0);

  // จำหน้าปัจจุบันไว้ใน URL (เฉพาะตอนผู้ใช้กดเปลี่ยนหน้าเอง)
  if (fromUser) {
    try { history.replaceState(null, '', location.pathname + '?page=' + page); } catch (e) { /* ignore */ }
  }
  if (page === 'reward') openReward();
  if (page === 'staff') openStaff();
  if (page === 'book') openBook();
}

function buildTabbar() {
  document.querySelectorAll('.tab').forEach((btn) => {
    const t = TABS.find((x) => x.page === btn.dataset.page);
    btn.innerHTML = ICON[t.icon] + '<span>' + t.label + '</span>';
    btn.addEventListener('click', () => go(t.page, true));
  });
}

function renderHome() {
  const d = state.data;

  let h = '';

  // 1) ภาพปก + ป้ายเปิด/ปิด
  const st = openStatus(s);
  h += '<div class="hero">' +
    (s.coverImage ? '<img class="cover" src="' + esc(sizedImg(s.coverImage, 1200)) + '" alt="" fetchpriority="high" onerror="this.remove()">' : '') +
    '<div class="txt">' +
    (s.logoImage ? '<img class="logo" src="' + esc(sizedImg(s.logoImage, 200)) + '" alt="" onerror="this.remove()">' : '') +
    (s.tagline ? '<div class="tag en">' + esc(s.tagline) + '</div>' : '') +
    '<h1>' + esc(s.heroTitle || s.shopName) + '</h1>' +
    (s.heroSubtitle ? '<div class="sub">' + esc(s.heroSubtitle) + '</div>' : '') +
    (st ? '<div class="status' + (st.open ? ' open' : '') + '" id="open-status"><i></i><span>' + esc(st.text) + '</span></div>' : '') +
    '</div></div>';

  if (s.announcement) h += '<div class="notice" style="margin-top:14px">' + ICON.info + '<div>' + esc(s.announcement) + '</div></div>';

  // 2) การ์ดสมาชิก
  h += '<div id="home-member"></div>';

  // 3) โปรโมชั่น
  const promos = d.promos || [];
  if (promos.length) {
    h += '<div class="sec"><h2>โปรโมชั่น</h2>' + (promos.length > 1 ? '<a href="#" data-go="promos">ทั้งหมด →</a>' : '') + '</div>' +
      '<div class="hs" id="promo-row">' + promos.map(promoCard).join('') + '</div>' +
      (promos.length > 1 ? '<div class="dots" id="promo-dots">' + promos.map((_, i) => '<i' + (i === 0 ? ' class="on"' : '') + '></i>').join('') + '</div>' : '');
  }

  // 4) เมนูแนะนำ
  const reco = [];
  (d.menu || []).forEach((g) => g.items.forEach((it) => { if (it.recommended && !it.soldOut) reco.push(it); }));
  if (reco.length) {
    h += '<div class="sec"><h2>เมนูแนะนำ</h2><a href="#" data-go="menu">ดูทั้งหมด →</a></div>' +
      '<div class="hs">' + reco.map((it) =>
        '<div class="item" data-go="menu">' + imgTag(it.image, it.name, 480) +
        '<div class="nm">' + esc(it.name) + '</div><div class="pr">' + priceText(it.price) + '</div></div>').join('') + '</div>';
  }

  // 5) Wellness
  if (d.wellness && d.wellness.title) h += wellnessCard(d.wellness);

  // 6) ข้อมูลร้าน
  const rows = [];
  if (s.openHours) rows.push(infoRow('clock', 'เวลาเปิด-ปิด', s.openHours));
  if (s.closedNote) rows.push(infoRow('calendar', 'วันหยุด', s.closedNote));
  if (s.address || s.mapUrl) {
    rows.push(infoRow('pin', 'ที่อยู่', s.address || 'ดูแผนที่',
      s.mapUrl ? '<button class="pill" data-link="' + esc(s.mapUrl) + '">นำทาง</button>' : ''));
  }
  if (s.phone) {
    rows.push(infoRow('phone', 'โทร', s.phone,
      '<a class="pill" href="tel:' + esc(s.phone.replace(/[^\d+]/g, '')) + '">โทรเลย</a>'));
  }
  const social = [];
  if (s.facebookUrl) social.push('<button class="pill" data-link="' + esc(s.facebookUrl) + '">Facebook</button>');
  if (s.instagramUrl) social.push('<button class="pill" data-link="' + esc(s.instagramUrl) + '">Instagram</button>');
  if (social.length) rows.push(infoRow('link', 'ติดตามเรา', '', '', '<div class="social">' + social.join('') + '</div>'));
  if (rows.length) h += '<div class="card home-info">' + rows.join('') + '</div>';

  $('#view-home').innerHTML = h;
  renderHomeMember();
  watchDots('promo-row', 'promo-dots');
}

/** การ์ดสมาชิกบนหน้าแรก: เป็นสมาชิก → แต้ม + ปุ่ม QR · ยังไม่เป็น → ชวนสมัคร */
function renderHomeMember() {
  const box = $('#home-member');
  if (!box || !state.data) return;
  const me = state.me || (CONFIG.LIFF_ID ? cachedMe() : null);
  const m = me && me.member;
  const r = (state.data.rewards || [])[0];
  if (m) {
    const target = r ? r.points : 10;
    const shown = Math.min(target, 12);
    const on = Math.min(m.points, target);
    const onSeg = Math.round((on / target) * shown);
    let note = 'แสดง QR ให้พนักงานเมื่อชำระเงิน';
    if (r) note = m.points >= r.points ? '🎉 แลก ' + r.name + ' ได้แล้ว!' : 'อีก ' + (r.points - m.points) + ' แต้ม รับ' + r.name;

function watchDots(rowId, dotsId) {
  const row = document.getElementById(rowId);
  const dots = document.getElementById(dotsId);
  if (!row || !dots) return;
  row.addEventListener('scroll', () => {
    const first = row.children[0];
    if (!first) return;
    const w = first.getBoundingClientRect().width + 12;
    const i = Math.min(dots.children.length - 1, Math.round(row.scrollLeft / w));
    Array.from(dots.children).forEach((d, k) => d.classList.toggle('on', k === i));
  }, { passive: true });
}

/**
 * ป้ายเปิด/ปิด คำนวณจากเวลาไทย (UTC+7)
 * shop.hours = [อา, จ, …, ส] แต่ละวัน [นาทีเปิด, นาทีปิด] หรือ null
 */
const DAY_TH = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
function openStatus(shop) {
  const hours = shop.hours || [];
  if (!hours.some(Boolean)) return null;
  const holidays = shop.holidays || [];
  const hm = (n) => ('0' + Math.floor(n / 60)).slice(-2) + ':' + ('0' + (n % 60)).slice(-2);
  const now = new Date(Date.now() + 7 * 3600e3);
  const iso = (d) => d.toISOString().slice(0, 10);
  const mins = now.getUTCHours() * 60 + now.getUTCMinutes();
  const todayH = holidays.indexOf(iso(now)) >= 0 ? null : hours[now.getUTCDay()];
  if (todayH && mins >= todayH[0] && mins < todayH[1]) return { open: true, text: 'เปิดอยู่ · ปิด ' + hm(todayH[1]) + ' น.' };
  if (todayH && mins < todayH[0]) return { open: false, text: 'ยังไม่เปิด · เปิด ' + hm(todayH[0]) + ' น.' };
  for (let i = 1; i <= 14; i++) {
    const d = new Date(now.getTime() + i * 864e5);
    const hh = holidays.indexOf(iso(d)) >= 0 ? null : hours[d.getUTCDay()];
    if (hh) return { open: false, text: 'ปิดแล้ว · เปิด' + (i === 1 ? 'พรุ่งนี้' : 'วัน' + DAY_TH[d.getUTCDay()]) + ' ' + hm(hh[0]) + ' น.' };
  }
  return { open: false, text: 'ปิดชั่วคราว' };
}

/** ไฮไลต์หมวดที่กำลังเลื่อนดูอยู่ */
let catObserver;
function watchCategories(n) {
  if (catObserver) catObserver.disconnect();
  if (!('IntersectionObserver' in window)) return;
  catObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      const i = en.target.id.replace('cat-', '');
      document.querySelectorAll('#chips .chip').forEach((c) => c.classList.toggle('active', c.dataset.cat === i));
      const act = document.querySelector('#chips .chip.active');
      if (act) act.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }, { rootMargin: '-70px 0px -70% 0px' });
  for (let i = 0; i < n; i++) {
    const el = document.getElementById('cat-' + i);
    if (el) catObserver.observe(el);
  }
}

async function initLiff() {

    state.liffReady = true;

  }
}

/** ต้องล็อกอิน LINE ก่อน (หน้าสมาชิก / พนักงาน) */
async function requireLogin(page) {
  const ok = await liffPromise;
  if (!ok) throw new Error('LIFF_FAILED');
  if (!liff.isLoggedIn()) {
    liff.login({ redirectUri: location.origin + location.pathname + '?page=' + page });
    throw new Error('REDIRECTING');
  }
}

/** เรียก API ที่ต้องยืนยันตัวตน */
async function api(action, data) {
  const idToken = liff.getIDToken();
  if (!idToken) {
    // ยังไม่มีบัตรยืนยันตัวตน (เพิ่งเปิดสิทธิ์ openid) → ล็อกอินใหม่ 1 ครั้ง
    debug('ไม่มี ID token (scope openid) → ล็อกอินใหม่');
    if (!session('get', 'relogin')) {
      session('set', 'relogin', '1');
      liff.logout();
      liff.login({ redirectUri: location.origin + location.pathname + '?page=' + state.page });
      throw new Error('REDIRECTING');
    }
    throw new Error('NO_TOKEN');
  }
  let out;
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // กัน CORS preflight
      body: JSON.stringify(Object.assign({ action: action, idToken: idToken }, data || {})),
    });
    out = await res.json();
  } catch (e) {
    throw new Error('NETWORK');
  }
  debug('API ' + action + ' → ' + JSON.stringify(out).slice(0, 160));
  if (out.ok && out.message && !out.profile && !out.member && !out.recent) {
    // ได้คำตอบของ doGet แทน doPost (คำขอถูกเปลี่ยนเป็น GET ระหว่างทาง)
    throw new Error('GOT_GET_RESPONSE');
  }
  if (!out.ok) {
    // token หมดอายุ → ล็อกอินใหม่ 1 ครั้ง
    if (out.error === 'INVALID_TOKEN' && !session('get', 'relogin')) {
      session('set', 'relogin', '1');
      liff.logout();
      liff.login({ redirectUri: location.origin + location.pathname + '?page=' + state.page });
      throw new Error('REDIRECTING');
    }
    throw new Error(out.error || 'SERVER_ERROR');
  }
  session('del', 'relogin');
  return out;
}

/** จำข้อมูลบัตรไว้ในเครื่อง → เปิดครั้งหน้าเห็นบัตรทันที */
function saveMe(me) {

  store('set', ME_KEY, me);
  renderHomeMember();
}

function cachedMe() {
  const c = store('get', ME_KEY);
  return c && c.profile ? c : null;
}

/** บัตรในเครื่องเป็นของบัญชี LINE ที่เปิดอยู่จริงไหม (เช็กหลังเชื่อม LINE เสร็จ) */
function sameUser(me) {
  try {
    const t = liff.getDecodedIDToken();
    return !(t && t.sub && me && me.profile && t.sub !== me.profile.userId);
  } catch (e) { return true; }
}

async function openReward(force) {
  const el = $('#view-reward');
  if (!CONFIG.LIFF_ID) { el.innerHTML = notReadyHtml('สะสมแต้ม'); return; }
  if (state.me && !force) { renderMember(); refreshMe(false); return; }

  const t0 = Date.now();
  const c = force ? null : cachedMe();
  if (c) {
    // 1) แสดงบัตรที่จำไว้ทันที ไม่ต้องรอ LINE หรือหลังบ้าน
    state.me = c;
    renderMember();
    debug('แสดงบัตรจากเครื่องใน ' + (Date.now() - t0) + ' ms');
  } else {
    el.innerHTML = '<div class="page-head"><p class="en">Member</p><h1>สะสมแต้ม</h1></div>' + spinner();
  }
  try {
    await requireLogin('reward');
    debug('เชื่อม LINE เสร็จใน ' + (Date.now() - t0) + ' ms');
    if (c && !sameUser(c)) {            // คนละบัญชี → ล้างแล้วโหลดใหม่
      store('set', ME_KEY, null);
      state.me = null;
      el.innerHTML = '<div class="page-head"><p class="en">Member</p><h1>สะสมแต้ม</h1></div>' + spinner();
    }
    // 2) อัปเดตแต้มล่าสุดจากหลังบ้าน
    saveMe(await api('me'));
    debug('ได้แต้มล่าสุดใน ' + (Date.now() - t0) + ' ms');
    renderMember();
  } catch (e) {
    if (state.me && e.message !== 'REDIRECTING') {
      debug('อัปเดตแต้มไม่สำเร็จ: ' + e.message); // ยังเห็นบัตรเดิมอยู่
    } else {
      pageError(el, e, () => openReward(true));
    }
  }
}

function renderMember() {
  if (!state.me || state.page !== 'reward') return;
  if (!state.me.member) renderRegister();
  else renderCard(state.me.member);
}

// ---------- สมัครสมาชิก ----------
function renderRegister() {
  const d = state.data;
  const svc = d && (d.services || []).find((s) => s.earnType === 'ตามยอดเงิน');
  const r = d && d.rewards && d.rewards[0];
  const intro = svc && r
    ? 'ทุกยอด ' + baht(svc.earnValue) + ' บาท รับ 1 แต้ม · ครบ ' + r.points + ' แต้ม แลก' + r.name
    : 'สะสมแต้มแลกของรางวัลที่ร้าน';

  $('#view-reward').innerHTML =
    '<div class="page-head"><p class="en">Join Member</p><h1>สมัครสมาชิก</h1></div>' +
    '<div class="notice">' + ICON.star + '<div>' + esc(intro) + '</div></div>' +
    '<form class="card" id="f-reg" novalidate>' +
    '<label class="f" for="r-name" style="margin-top:0">ชื่อเล่น</label>' +
    '<input class="input" id="r-name" maxlength="40" autocomplete="nickname" value="' + esc((state.me.profile || {}).name) + '">' +
    '<label class="f" for="r-phone">เบอร์โทรศัพท์</label>' +
    '<input class="input" id="r-phone" type="tel" inputmode="numeric" maxlength="12" placeholder="08x-xxx-xxxx" autocomplete="tel">' +
    '<label class="f" for="r-bd">วันเกิด <span class="muted small">(ไม่บังคับ · รับสิทธิพิเศษเดือนเกิด)</span></label>' +
    '<input class="input" id="r-bd" type="date">' +
    '<label class="check"><input type="checkbox" id="r-ok"><span>ยินยอมให้ร้านเก็บชื่อ เบอร์โทร และวันเกิด เพื่อใช้กับระบบสมาชิกและแจ้งสิทธิประโยชน์เท่านั้น</span></label>' +
    '<button class="btn gold" id="r-btn" type="submit">สมัครสมาชิก</button>' +
    '</form>';

  $('#f-reg').onsubmit = async (ev) => {
    ev.preventDefault();
    const name = $('#r-name').value.trim();
    const phone = $('#r-phone').value.replace(/\D/g, '');
    if (!name) return toast('กรุณากรอกชื่อเล่น', 'error');
    if (!/^0\d{8,9}$/.test(phone)) return toast('เบอร์โทรไม่ถูกต้อง', 'error');
    if (!$('#r-ok').checked) return toast('กรุณากดยินยอมก่อนสมัคร', 'error');
    const btn = $('#r-btn');
    btn.disabled = true; btn.textContent = 'กำลังสมัคร…';
    try {
      const out = await api('register', { nickname: name, phone: phone, birthday: $('#r-bd').value, consent: true });
      state.me.member = out.member;
      saveMe(state.me);
      toast('สมัครสมาชิกเรียบร้อย 🎉', 'ok');
      renderCard(out.member);
    } catch (e) {
      if (e.message !== 'REDIRECTING') toast(errText(e), 'error');
      btn.disabled = false; btn.textContent = 'สมัครสมาชิก';
    }
  };
}

// ---------- บัตรสมาชิก ----------
function renderCard(m) {
  const d = state.data || { shop: {}, rewards: [] };
  const rewards = d.rewards || [];
  let h = '';

  // บัตร
  const partialPct = Math.round(num(m.partial) * 100);
  h += '<div class="mcard">' +
    '<div class="top"><span class="brand">' + esc(d.shop.shopName || '2325 CAFE') + '</span><span class="tier en">Member</span></div>' +
    '<div class="who">' +
    (m.pictureUrl ? '<img class="avatar" src="' + esc(m.pictureUrl) + '" alt="">' : '<div class="avatar"></div>') +
    '<div><div class="nm">' + esc(m.displayName) + '</div><div class="mid">' + fmtId(m.memberId) + '</div></div></div>' +
    '<div class="pts"><b>' + m.points + '</b><span>แต้ม</span></div>' +
    (m.nextPointBaht != null
      ? '<div class="bar"><i style="width:' + partialPct + '%"></i></div>' +
        '<div class="next">อีก ' + baht(m.nextPointBaht) + ' บาท รับแต้มถัดไป</div>'
      : '') +
    '</div>';

  // รางวัล
  if (rewards.length) {
    h += '<div class="card"><div class="card-title">ของรางวัล</div>' + rewards.map((r) => {
      const ready = m.points >= r.points;
      const pct = Math.min(100, Math.round((m.points / r.points) * 100));
      return '<div class="reward' + (ready ? ' ready' : '') + '">' +
        '<div class="ic">' + ICON.gift + '</div>' +
        '<div class="body"><div class="nm">' + esc(r.name) + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="st">' + (ready ? 'แลกได้แล้ว! แจ้งพนักงานที่ร้าน' : 'อีก ' + (r.points - m.points) + ' แต้ม') + '</div></div>' +
        '<div class="muted small" style="flex:none">' + r.points + ' แต้ม</div></div>';
    }).join('') + '</div>';
  }

  // QR
  h += '<div class="card center"><div class="card-title">แสดง QR ให้พนักงานเมื่อชำระเงิน</div>' +
    '<div class="qr-box"><div id="qr"></div></div>' +
    '<p class="muted small" style="margin-top:10px">หรือแจ้งรหัสสมาชิก ' + fmtId(m.memberId) + ' / เบอร์โทร</p></div>';

  // สถิติ + ประวัติ
  h += '<div class="card"><div class="stat3">' +
    '<div><b>' + m.lifetimePoints + '</b><span>แต้มสะสมทั้งหมด</span></div>' +
    '<div><b>' + m.visits + '</b><span>ครั้งที่มาร้าน</span></div>' +
    '<div><b>' + m.redeemCount + '</b><span>แลกรางวัล</span></div></div>' +
    '<div id="hist" style="margin-top:14px"><button class="btn line" id="btn-hist">ดูประวัติแต้ม</button></div></div>';

  if (d.shop.memberNote) h += '<p class="muted small center" style="margin:4px 8px 14px">' + esc(d.shop.memberNote) + '</p>';
  h += '<button class="btn soft" id="btn-refresh">อัปเดตแต้ม</button>';

  $('#view-reward').innerHTML = h;
  drawQr(m.memberId);
  $('#btn-hist').onclick = loadHistory;
  $('#btn-refresh').onclick = () => refreshMe(true);
}

function fmtId(id) { return esc(String(id).replace(/^(\d{3})(\d{3})$/, '$1 $2')); }

function drawQr(text, target, size) {
  const box = target || $('#qr');
  if (!box) return;
  box.innerHTML = '';
  try {
    new QRCode(box, { text: String(text), width: size || 176, height: size || 176, colorDark: '#2B2A28', correctLevel: QRCode.CorrectLevel.M });
  } catch (e) {
    box.innerHTML = '<div class="qr-fallback">' + fmtId(text) + '</div>'; // โหลดตัวสร้าง QR ไม่ได้ → แสดงรหัสแทน
  }
}

async function loadHistory() {
  const box = $('#hist');
  box.innerHTML = spinner();
  try {
    const out = await api('myHistory');
    box.innerHTML = out.recent.length ? histList(out.recent) : '<p class="muted small center">ยังไม่มีประวัติ</p>';
  } catch (e) {
    if (e.message !== 'REDIRECTING') box.innerHTML = '<p class="muted small center">' + errText(e) + '</p>';
  }
}

function histList(list) {
  return '<ul class="hist">' + list.map((t) => {
    const title = t.type === 'แลกรางวัล' ? 'แลก ' + esc(t.reward)
      : esc(t.service || 'ได้แต้ม') + (t.amount ? ' · ' + baht(t.amount) + ' บาท' : '');
    const cls = t.points > 0 ? 'plus' : t.points < 0 ? 'minus' : '';
    return '<li><div><div>' + title + '</div><div class="muted small">' + formatDate(t.time, true) + '</div></div>' +
      '<div class="p ' + cls + '">' + (t.points > 0 ? '+' : '') + t.points + '</div></li>';
  }).join('') + '</ul>';
}

async function refreshMe(showToast) {
  const btn = $('#btn-refresh');
  if (btn) { btn.disabled = true; btn.textContent = 'กำลังอัปเดต…'; }
  try {
    saveMe(await api('me'));
    renderMember();
    if (showToast) toast('อัปเดตแล้ว', 'ok');
  } catch (e) {
    if (showToast && e.message !== 'REDIRECTING') toast(errText(e), 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'อัปเดตแต้ม'; }
  }
}

// กลับมาที่แอป (เช่น หลังพนักงานให้แต้ม) → อัปเดตเอง
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.page === 'reward' && state.me && state.me.member) refreshMe(false);
});


// ════════════════════════════════════════════════════════════════
//  ส่วนที่ 10.5: จอง Wellness (ลูกค้า)   ⛔ ไม่ต้องแก้
//  ขั้นตอน: เลือกคน/วัน/รอบ → ยืนยัน → โอนมัดจำ + แนบสลิป → ใบจอง
// ════════════════════════════════════════════════════════════════

const BST = { HOLD: 'รอชำระมัดจำ', SLIP: 'รอตรวจสลิป', OK: 'ยืนยันแล้ว', IN: 'เช็กอินแล้ว' };
const TH_DOW = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

function isoParts(iso) {
  const d = new Date(iso + 'T12:00:00Z');
  return { dow: d.getUTCDay(), day: d.getUTCDate(), mon: d.getUTCMonth(), year: d.getUTCFullYear() };
}
function thDate(iso, withYear) {
  const p = isoParts(iso);
  return TH_DOW[p.dow] + ' ' + p.day + ' ' + TH_MON[p.mon] + (withYear ? ' ' + String(p.year + 543).slice(2) : '');
}
function isoToday() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
function bcfg() { return state.data && state.data.wellness && state.data.wellness.booking; }
function bstPill(st) {
  const cls = st === BST.OK ? 'ok' : st === BST.IN ? 'done' : st === BST.HOLD || st === BST.SLIP ? 'wait' : 'bad';
  return '<span class="bst ' + cls + '">' + esc(st) + '</span>';
}
function li(label, valHtml, cls) {
  return '<div class="li' + (cls ? ' ' + cls : '') + '"><span>' + esc(label) + '</span><b>' + valHtml + '</b></div>';
}
function bkHead(en, title, backLabel) {
  return '<div class="bk-head"><button class="back" id="bk-back">' + ICON.arrow + esc(backLabel || 'ย้อนกลับ') + '</button>' +
    '<p class="en">' + esc(en) + '</p><h1>' + esc(title) + '</h1></div>';
}
function onBack(fn) { const b = $('#bk-back'); if (b) b.onclick = fn; }
function bkTitle() { return (state.data.wellness && state.data.wellness.title) || 'Wellness'; }

/** ราคา: เลือกเรทตามจำนวนคน + มัดจำ + หักเครดิต (สูตรเดียวกับหลังบ้าน) */
function calcBooking(people, credit) {
  const b = bcfg();
  const t = (b.tiers || []).find((x) => people >= x.min && people <= x.max);
  if (!t) return null;
  const total = t.price * people;
  const deposit = Math.ceil((total * b.depositPct) / 100);
  const used = Math.min(num(credit), total);
  return { tier: t, total: total, deposit: deposit, used: used,
    payDue: Math.max(0, deposit - used), payAtShop: total - deposit - Math.max(0, used - deposit) };
}

function policyLines(b) {
  const out = [];
  if (b.depositPct) out.push('ชำระมัดจำ ' + b.depositPct + '% ภายใน ' + b.holdMin + ' นาที มิฉะนั้นรอบจะถูกปล่อยให้คนอื่นจอง');
  out.push('เลื่อนนัดได้ฟรี 1 ครั้ง ก่อนเวลาอย่างน้อย ' + b.cancelHours + ' ชม.');
  out.push('ยกเลิกก่อน ' + b.cancelHours + ' ชม. มัดจำเก็บเป็นเครดิต ใช้จองครั้งถัดไปได้ภายใน ' + b.creditDays + ' วัน');
  out.push('ยกเลิกน้อยกว่า ' + b.cancelHours + ' ชม. หรือไม่มาตามนัด ไม่คืนมัดจำ');
  return out.concat(b.policyExtra || []);
}

/** เปิดหน้าจอง: มีรายการรอจ่าย → หน้าจ่าย · มีการจอง → รายการของฉัน · ไม่มี → เริ่มจอง */
async function openBook() {
  const el = $('#view-book');
  const w = state.wb;
  if (!CONFIG.LIFF_ID) { el.innerHTML = notReadyHtml('จอง Wellness'); return; }
  el.innerHTML = bkHead('Book · Wellness', 'จองคิว Wellness', 'Wellness') + spinner();
  onBack(() => go('wellness', true));
  loadSlots();
  try {
    await requireLogin('book');
    await Promise.race([dataReady, new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), 35000))]);
    w.mine = await api('wbMine');
    if (state.page !== 'book') return;
    const hold = w.mine.bookings.find((b) => b.status === BST.HOLD);
    const intent = w.intent;
    w.intent = '';
    if (hold) return renderPay(hold);                       // ค้างจ่ายมัดจำ → ไปหน้าจ่ายก่อน
    if (intent === 'new') return startPick();                // กด "จองคิว"
    if (intent === 'mine' || w.mine.bookings.length) return renderBookList(); // กด "การจองของฉัน"
    startPick();
  } catch (e) {
    pageError(el, e, openBook);
  }
}

/** รอบว่าง (ไม่ต้องล็อกอิน · โหลดพร้อมกับการเชื่อม LINE) */
async function loadSlots() {
  const w = state.wb;
  try {
    const res = await fetch(CONFIG.API_URL + '?action=slots', { cache: 'no-store' });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || 'SERVER_ERROR');
    w.days = d.days;
    w.slotErr = '';
  } catch (e) {
    debug('โหลดรอบว่างไม่สำเร็จ: ' + e.message);
    w.slotErr = /fetch|network|load failed/i.test(e.message) ? 'NETWORK' : e.message;
    w.days = w.days || [];
  }
  if (state.page === 'book' && w.step === 'pick') renderPick();
}

async function reloadMine() {
  state.wb.mine = await api('wbMine');
  return state.wb.mine;
}

// ---------- 1) เลือกจำนวนคน วัน รอบ ----------
function startPick(resched) {
  const w = state.wb;
  w.resched = resched || null;
  w.people = resched ? resched.people : Math.max(1, w.people || 1);
  w.date = '';
  w.time = '';
  w.step = 'pick';
  renderPick();
  window.scrollTo(0, 0);
  loadSlots();
}

function renderPick() {
  const w = state.wb;
  const b = bcfg();
  const el = $('#view-book');
  if (!b || !b.tiers || !b.tiers.length) {
    el.innerHTML = bkHead('Book · Wellness', 'จองคิว Wellness', 'Wellness') + '<div class="card center muted">ยังไม่เปิดระบบจอง</div>';
    onBack(() => go('wellness', true));
    return;
  }
  const staffOnly = b.mode === 'เฉพาะพนักงาน' && !(w.mine && w.mine.isStaff);
  if (!w.resched && (b.mode === 'ปิด' || staffOnly)) {
    el.innerHTML = bkHead('Book · Wellness', 'จองคิว Wellness', 'Wellness') +
      '<div class="card center"><p class="card-title">ยังไม่เปิดรับจองตอนนี้</p><p class="muted small">ติดตามวันเปิดจองได้ทางแชท LINE ของร้าน</p></div>';
    onBack(() => go('wellness', true));
    return;
  }
  const credit = w.resched ? 0 : (w.mine ? w.mine.credit : 0);
  const c = calcBooking(w.people, credit);
  const days = w.days;
  if (days && !w.date) {
    const d = days.find((x) => x.slots.some((s) => s.s === 'free'));
    if (d) w.date = d.date;
  }
  const keepScroll = $('#days') ? $('#days').scrollLeft : null;

  let h = bkHead(w.resched ? 'Reschedule' : 'Book · ' + bkTitle(), w.resched ? 'เลื่อนนัด' : 'จองคิว Wellness',
    w.resched ? 'การจองของฉัน' : (w.mine && w.mine.bookings.length ? 'การจองของฉัน' : 'Wellness'));
  if (b.mode === 'เฉพาะพนักงาน') h += '<div class="notice">' + ICON.info + '<div>โหมดทดสอบ: ลูกค้ายังจองไม่ได้ เฉพาะพนักงานเท่านั้น</div></div>';
  if (w.resched) {
    h += '<div class="notice">' + ICON.calendar + '<div>เลื่อนจาก <b>' + thDate(w.resched.date) + ' · ' + w.resched.time + ' น.</b><br>' +
      '<span class="small">เลื่อนได้ฟรี 1 ครั้ง · ' + w.resched.people + ' ท่าน</span></div></div>';
  } else if (credit) {
    h += '<div class="notice">' + ICON.gift + '<div>มีเครดิตมัดจำ <b>' + baht(credit) + '.-</b> หักให้อัตโนมัติ</div></div>';
  }

  // จำนวนคน
  if (!w.resched) {
    h += '<div class="card"><div class="card-title">จำนวนผู้ใช้บริการ</div><div class="tiers">' + b.tiers.map((t) =>
      '<div class="tier' + (c && c.tier === t ? ' on' : '') + '"><b>' + esc(t.label) + '</b><span>' + baht(t.price) + '.-' + (t.max > 1 ? '/ท่าน' : '') + '</span></div>').join('') +
      '</div><div class="stepper"><button id="pp-minus" aria-label="ลดจำนวน"' + (w.people <= 1 ? ' disabled' : '') + '>−</button>' +
      '<div class="n"><b>' + w.people + '</b><span>ท่าน · ห้องส่วนตัวทั้งรอบ</span></div>' +
      '<button id="pp-plus" aria-label="เพิ่มจำนวน"' + (w.people >= b.maxPeople || !calcBooking(w.people + 1, 0) ? ' disabled' : '') + '>+</button></div></div>';
  }

  // วันที่
  const sel = w.date ? isoParts(w.date) : null;
  h += '<div class="card"><div class="card-title">วันที่' + (sel ? ' <span class="muted small" style="font-weight:400">· ' + TH_MON[sel.mon] + ' ' + (sel.year + 543) + '</span>' : '') + '</div>';
  if (!days) h += '<div class="skeleton" style="height:66px"></div>';
  else if (!days.length) h += '<p class="muted small">' + (w.slotErr ? errText(new Error(w.slotErr)) : 'ยังไม่มีรอบให้จอง') + '</p><button class="btn soft" id="slots-retry" style="margin-top:10px">ลองใหม่</button>';
  else {
    h += '<div class="days" id="days">' + days.map((d) => {
      const p = isoParts(d.date);
      const free = d.slots.filter((s) => s.s === 'free').length;
      const lab = !d.slots.length ? 'ปิด' : free ? 'ว่าง ' + free : 'เต็ม';
      return '<button class="day' + (d.date === w.date ? ' on' : '') + '" data-day="' + d.date + '"' + (free ? '' : ' disabled') + '>' +
        '<small>' + (d.date === isoToday() ? 'วันนี้' : TH_DOW[p.dow]) + '</small><b>' + p.day + '</b><i>' + lab + '</i></button>';
    }).join('') + '</div>';
  }
  h += '</div>';

  // รอบเวลา
  const day = days && days.find((d) => d.date === w.date);
  h += '<div class="card"><div class="card-title">รอบเวลา <span class="muted small" style="font-weight:400">· ใช้บริการ ' + b.sessionMin + ' นาที</span></div>';
  if (!days) h += '<div class="skeleton" style="height:120px"></div>';
  else if (!day) h += '<p class="muted small">เลือกวันที่ก่อน</p>';
  else {
    const list = day.slots.filter((s) => s.s !== 'past');
    h += '<div class="slots">' + list.map((s) => {
      const on = s.t === w.time;
      return '<button class="slot' + (on ? ' on' : '') + '" data-slot="' + s.t + '"' + (s.s === 'free' ? '' : ' disabled') + '>' + s.t +

  onBack(() => {
    if (w.resched) return renderTicket(w.resched);

/** ย่อรูปสลิปก่อนส่ง (กว้างสุด 1400px · JPEG) */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('BAD_IMAGE')); };
    img.src = url;
  });
}

/** PromptPay QR (มาตรฐาน EMVCo) พร้อมยอดเงิน */
function promptpayPayload(id, amount) {
  const f = (tag, v) => tag + ('0' + v.length).slice(-2) + v;
  const d = String(id).replace(/\D/g, '');
  const acc = d.length >= 13 ? f(d.length === 15 ? '03' : '02', d)
    : f('01', ('0000000000000' + d.replace(/^0/, '66')).slice(-13));
  const p = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + acc) +
    f('58', 'TH') + f('53', '764') + (amount ? f('54', amount.toFixed(2)) : '') + '6304';
  return p + crc16(p);
}
function crc16(s) {
  let crc = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return ('000' + crc.toString(16).toUpperCase()).slice(-4);
}

async function cancelBooking(bk) {
  const b = bcfg();
  let msg = 'ยกเลิกการจอง ' + thDate(bk.date) + ' ' + bk.time + ' น.?';
  if (bk.status === BST.OK) {
    msg += bk.cancelGetsCredit
      ? '\n\nมัดจำ ' + baht(bk.credit + bk.payDue) + ' บาท จะเก็บเป็นเครดิต ใช้ได้ ' + b.creditDays + ' วัน'
      : '\n\nเหลือเวลาน้อยกว่า ' + b.cancelHours + ' ชม. จะไม่ได้รับมัดจำคืน';
  }
  if (!confirm(msg)) return;
  try {
    const out = await api('wbCancel', { bookingId: bk.id });
    toast(out.credit ? 'ยกเลิกแล้ว · ได้เครดิต ' + baht(out.credit) + ' บาท' : 'ยกเลิกแล้ว', 'ok');
    state.wb.mine = null;
    await showMine();
  } catch (e) {
    if (e.message !== 'REDIRECTING') toast(errText(e), 'error');
  }
}

async function doReschedule() {
  const w = state.wb;
  const btn = $('#bk-next');
  btn.disabled = true; btn.textContent = 'กำลังเลื่อน…';
  try {
    const out = await api('wbReschedule', { bookingId: w.resched.id, date: w.date, time: w.time });

    btn.disabled = false; btn.textContent = 'ยืนยันเลื่อน';
  }
}

  if (m.past.length) h += '<div class="card"><div class="card-title">ที่ผ่านมา</div>' + m.past.map((b) => bookingItem(b, 'data-bk')).join('') + '</div>';
  h += '<button class="btn sea" id="bk-new">' + ICON.calendar + 'จองรอบใหม่</button>';

document.addEventListener('visibilitychange', async () => {

  box.innerHTML = spinner();

    const out = await api('staffLookup', { query: q });

    state.staffRecent = out.recent;
    renderStaffMember();
  } catch (e) {
    box.innerHTML = '';
    if (e.message !== 'REDIRECTING') toast(errText(e), 'error');
  }
}

    h += '<p class="muted small">ยังไม่มีบริการที่เปิดใช้ในแท็บ "บริการ"</p>';
  } else {
    if (services.length > 1) {
      h += '<div class="seg">' + services.map((s) =>
        '<button class="chip' + (s.id === state.staffService ? ' active' : '') + '" data-svc="' + esc(s.id) + '">' + esc(s.name) + '</button>').join('') + '</div>';

      '<input class="input" id="rcp" maxlength="40" autocomplete="off" placeholder="เช่น R-000123">' +
      '<div class="preview" id="pv"></div>' +

        '<button class="pill" data-redeem="' + esc(r.id) + '"' + (ok ? '' : ' disabled style="opacity:.4"') + '>แลก</button></div>';

/** คำนวณแต้มล่วงหน้าให้พนักงานตรวจก่อนกดยืนยัน (สูตรเดียวกับหลังบ้าน) */
function calcPreview() {
  const m = state.staffMember;
  const svc = state.data.services.find((s) => s.id === state.staffService);
  const amount = Math.round(num($('#amt').value) * 100) / 100;
  const receipt = $('#rcp').value.trim();
  if (svc.earnType === 'ตามยอดเงิน') {
    if (!(amount > 0)) return { ok: false, text: 'กรอกยอดบิลเพื่อคำนวณแต้ม' };
    const rate = Math.max(1, num(svc.earnValue));
    const raw = round4(num(m.partial) + amount / rate);
    const pts = Math.floor(raw + 1e-9);
    const left = round4(raw - pts);
    const next = Math.max(1, Math.ceil(round4((1 - left) * rate)));
    return {
      ok: !!receipt, points: pts, amount: amount,
      text: '<b>+' + pts + ' แต้ม</b> จากยอด ' + baht(amount) + ' บาท' +
        (num(m.partial) > 0 ? ' (รวมเศษเดิม ' + baht(Math.round(num(m.partial) * rate)) + ' บาท)' : '') +
        '<br><span class="muted small">หลังให้แต้ม: อีก ' + baht(next) + ' บาท ได้แต้มถัดไป' +
        (receipt ? '' : ' · <b style="color:var(--danger)">กรอกเลขใบเสร็จ</b>') + '</span>',
    };
  }
  const pts = Math.max(0, Math.floor(num(svc.earnValue)));
  return { ok: true, points: pts, amount: amount, text: '<b>+' + pts + ' แต้ม</b> จาก ' + esc(svc.name) };
}

function updatePreview() {
  const p = calcPreview();
  $('#pv').innerHTML = p.text;
  const btn = $('#btn-earn');
  btn.disabled = !p.ok;
  btn.textContent = p.ok ? 'ยืนยันให้ ' + p.points + ' แต้ม' : 'ยืนยันให้แต้ม';
}

async function earn() {
  const p = calcPreview();
  if (!p.ok) return;
  const btn = $('#btn-earn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    const out = await api('earn', {
      memberId: state.staffMember.memberId, serviceId: state.staffService,
      amount: p.amount, receiptNo: $('#rcp').value.trim(),
    });
    state.staffMember = out.member;
    state.staffRecent = out.recent;
    renderStaffMember();
    toast('ให้ +' + out.earned + ' แต้มแล้ว · คงเหลือ ' + out.member.points, 'ok');
  } catch (e) {
    if (e.message !== 'REDIRECTING') toast(errText(e), 'error');
    btn.disabled = false; updatePreview();
  }
}

async function redeem(rewardId) {
  const r = state.data.rewards.find((x) => x.id === rewardId);
  if (!r || !confirm('แลก "' + r.name + '" ให้ ' + state.staffMember.displayName + '?\nใช้ ' + r.points + ' แต้ม')) return;
  try {
    const out = await api('redeem', { memberId: state.staffMember.memberId, rewardId: rewardId });
    state.staffMember = out.member;
    state.staffRecent = out.recent;
    renderStaffMember();
    toast('แลกรางวัลเรียบร้อย 🎁', 'ok');
  } catch (e) {
    if (e.message !== 'REDIRECTING') toast(errText(e), 'error');
  }
}

document.addEventListener('click', (ev) => {
  const bk = ev.target.closest('[data-book]');
  if (bk) { ev.preventDefault(); state.wb.intent = bk.dataset.book; go('book', true); return; }
  const pr = ev.target.closest('[data-promo]');
  if (pr) { ev.preventDefault(); openPromo(Number(pr.dataset.promo)); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { ev.preventDefault(); go(g.dataset.go, true); return; }
  const l = ev.target.closest('[data-link]');
  if (l) { ev.preventDefault(); openLink(l.dataset.link); }
});

debug('เริ่มแอป · หน้า ' + initialPage() + ' · ' + navigator.userAgent.slice(0, 90));
buildTabbar();
renderLoading();
loadPublic();               // เริ่มโหลดข้อมูลร้านก่อน (ทำพร้อมกับการเชื่อม LINE)
liffPromise = initLiff();
go(initialPage(), false);

// หน้าแรก: เชื่อม LINE เสร็จแล้ว → อัปเดตแต้มบนการ์ดสมาชิกเงียบๆ (ไม่บังคับล็อกอิน)
liffPromise.then(async (ok) => {
  if (!ok || !liff.isLoggedIn() || !liff.getIDToken() || state.page === 'reward' || state.page === 'staff') return;
  const c = cachedMe();
  if (c && !sameUser(c)) store('set', ME_KEY, null);
  try { saveMe(await api('me')); } catch (e) { debug('อัปเดตการ์ดสมาชิกไม่สำเร็จ: ' + e.message); }
});
</script>
</body>
</html>
